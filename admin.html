<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111d">
  <meta name="description" content="Administração de solicitações de acesso do BoRan Studio.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <title>Administração · BoRan Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111d;
      --surface: #0d1828;
      --surface-elevated: #122034;
      --surface-hover: #16273f;
      --line: rgba(183, 205, 229, 0.12);
      --line-strong: rgba(183, 205, 229, 0.22);
      --text: #eef4f8;
      --text-secondary: #a9bad0;
      --muted: #7d91aa;
      --accent: #00b4e6;
      --ok: #22c55e;
      --ok-soft: rgba(34, 197, 94, 0.12);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.12);
      --err: #ef4444;
      --err-soft: rgba(239, 68, 68, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --font-display: "Plus Jakarta Sans", sans-serif;
      --font-sans: "DM Sans", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hidden { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

    .topbar {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .brand-lockup img { width: 30px; height: 30px; border-radius: 7px; display: block; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .nav-links a {
      white-space: nowrap;
      transition: color 150ms var(--ease);
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .page-head h1 {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 4px;
    }
    .page-head p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .auth-box {
      max-width: 420px;
      margin: 48px auto;
      padding: 28px;
    }
    .auth-box h2 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      margin: 0 0 6px;
    }
    .auth-box p {
      margin: 0 0 20px;
      color: var(--text-secondary);
      font-size: 13.5px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--text);
    }
    .input:focus { outline: none; border-color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 38px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
    }
    .btn:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--line-strong); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #04131e;
      width: 100%;
      height: 42px;
      margin-top: 6px;
    }
    .btn-primary:hover:not(:disabled) { background: #1dc3f0; border-color: #1dc3f0; }
    .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
    .btn-approve { background: var(--ok-soft); border-color: rgba(34, 197, 94, 0.3); color: #86efac; }
    .btn-approve:hover:not(:disabled) { background: rgba(34, 197, 94, 0.2); }
    .btn-reject { background: var(--err-soft); border-color: rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .btn-reject:hover:not(:disabled) { background: rgba(239, 68, 68, 0.2); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }
    .seg-btn {
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.active { background: var(--surface-elevated); color: var(--text); font-weight: 600; }

    .search-box {
      width: 260px;
      height: 38px;
      padding: 0 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }

    .banner {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13px;
    }
    .banner.error { border-color: rgba(239, 68, 68, 0.35); background: var(--err-soft); color: #fecaca; }
    .banner.success { border-color: rgba(34, 197, 94, 0.3); background: var(--ok-soft); color: #bbf7d0; }
    .banner.warn { border-color: rgba(245, 158, 11, 0.35); background: var(--warn-soft); color: #fde68a; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td {
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table th {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.015);
    }
    .data-table tbody tr:hover { background: var(--surface-elevated); }
    .row-name { font-weight: 600; color: var(--text); }
    .row-email { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .status-text { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .status-text.ok { color: var(--ok); }
    .status-text.warn { color: var(--warn); }
    .status-text.err { color: var(--err); }
    .status-text.muted { color: var(--muted); }
    .actions { display: inline-flex; gap: 8px; }
    .empty { padding: 36px 24px; text-align: center; color: var(--muted); }

    @media (max-width: 720px) {
      .topbar { padding: 0 16px; }
      .nav-links { display: none; }
      .container { padding: 20px 16px 48px; }
      .page-head { flex-direction: column; align-items: flex-start; }
      .search-box { width: 100%; }
      .data-table th:nth-child(3), .data-table td:nth-child(3) { display: none; }
      .data-table th, .data-table td { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand-lockup" href="./">
      <img src="./icon.svg" alt="BoRan Studio" width="30" height="30">
      <span>BoRan Studio</span>
    </a>
    <nav class="nav-links" aria-label="Navegação">
      <a href="./">Portal</a>
      <a href="./dashboard.html">Dashboard</a>
      <a class="active" href="./admin.html">Administração</a>
    </nav>
    <div class="topbar-actions">
      <span id="admin-email" class="muted" style="font-size:12.5px;"></span>
      <button id="logout-btn" class="btn btn-sm hidden" type="button">Sair</button>
    </div>
  </header>

  <main class="container">
    <section id="login-section" class="panel auth-box hidden">
      <h2>Acesso administrativo</h2>
      <p>Entre com sua conta autorizada para revisar solicitações de cadastro.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" class="input" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" class="input" type="password" autocomplete="current-password" required>
        </div>
        <button id="login-btn" class="btn btn-primary" type="submit">Entrar</button>
      </form>
      <div id="login-notice" class="banner hidden" style="margin-top:14px;margin-bottom:0;" role="status"></div>
    </section>

    <section id="admin-section" class="hidden">
      <div class="page-head">
        <div>
          <h1>Administração de cadastros</h1>
          <p>Aprove ou rejeite solicitações de acesso à organização BoRan Studio.</p>
        </div>
        <button id="reload-btn" class="btn btn-sm" type="button">Atualizar lista</button>
      </div>

      <div id="notice" class="banner" role="status">Verificando permissões…</div>

      <div class="toolbar">
        <div class="segmented" role="tablist" aria-label="Filtrar solicitações">
          <button class="seg-btn active" type="button" data-filter="all">Todas</button>
          <button class="seg-btn" type="button" data-filter="pending">Pendentes</button>
          <button class="seg-btn" type="button" data-filter="approved">Aprovadas</button>
          <button class="seg-btn" type="button" data-filter="rejected">Rejeitadas</button>
        </div>
        <input id="search-input" class="search-box" type="search" placeholder="Buscar por nome ou e-mail…" aria-label="Buscar por nome ou e-mail">
      </div>

      <div class="panel">
        <div id="requests-table"></div>
      </div>
    </section>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    function createSafeStorage() {
      const mem = new Map();
      try {
        const testKey = "__boran_storage_test__";
        window.localStorage.setItem(testKey, "1");
        window.localStorage.removeItem(testKey);
        return window.localStorage;
      } catch {
        return {
          getItem: (k) => (mem.has(k) ? mem.get(k) : null),
          setItem: (k, v) => { mem.set(k, String(v)); },
          removeItem: (k) => { mem.delete(k); },
        };
      }
    }

    async function loadSupabaseClient() {
      const urls = [
        "https://esm.sh/@supabase/supabase-js@2.117.3",
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm",
      ];
      let lastError;
      for (const url of urls) {
        try {
          const mod = await import(url);
          if (typeof mod?.createClient === "function") return mod.createClient;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("Não foi possível carregar o cliente Supabase.");
    }

    const DEFAULT_CONFIG = {
      url: "https://ipqrxdozzlenmanykgoz.supabase.co",
      publishableKey: "sb_publishable_hV2iHEN9aiJUdz9r0MEJBQ_ZlL1DY0X",
    };

    const injected = window.JSLYNK_AUTH_CONFIG || {};
    const validInjected =
      /^https:\/\//.test(injected.url || "") &&
      /^(sb_publishable_[A-Za-z0-9_\-]+|eyJ[A-Za-z0-9_\-\.]+)$/.test(injected.publishableKey || "");
    const config = validInjected ? injected : DEFAULT_CONFIG;

    let supabase = null;
    const state = { requests: [], filter: "all", search: "", isAdmin: false };

    function setNotice(id, text, type = "") {
      const el = $(id);
      if (!text) { el.classList.add("hidden"); return; }
      el.textContent = text;
      el.className = "banner" + (type ? " " + type : "");
    }

    function renderTable() {
      const root = $("requests-table");
      root.replaceChildren();

      if (!state.isAdmin) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Acesso restrito a administradores autorizados.";
        root.append(empty);
        return;
      }

      const items = state.requests.filter((item) => {
        const st = item.status || "pending";
        if (state.filter !== "all" && st !== state.filter) return false;
        if (!state.search) return true;
        const q = state.search.toLowerCase();
        return (item.name || "").toLowerCase().includes(q) || (item.email || "").toLowerCase().includes(q);
      });

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nenhuma solicitação encontrada para este filtro.";
        root.append(empty);
        return;
      }

      const table = document.createElement("table");
      table.className = "data-table";
      table.innerHTML = "<thead><tr><th>Solicitante</th><th>Status</th><th>Recebida em</th><th>Ações</th></tr></thead>";
      const tbody = document.createElement("tbody");

      for (const item of items) {
        const tr = document.createElement("tr");

        const tdInfo = document.createElement("td");
        const name = document.createElement("span");
        name.className = "row-name";
        name.textContent = item.name || "Sem nome";
        const email = document.createElement("span");
        email.className = "row-email";
        email.textContent = item.email || "";
        tdInfo.append(name, email);

        const tdStatus = document.createElement("td");
        const st = item.status || "pending";
        const statusEl = document.createElement("span");
        statusEl.className = "status-text " + (st === "approved" ? "ok" : st === "rejected" ? "err" : "warn");
        statusEl.textContent = st === "approved" ? "Aprovado" : st === "rejected" ? "Rejeitado" : "Pendente";
        tdStatus.append(statusEl);

        const tdDate = document.createElement("td");
        tdDate.className = "tabular";
        tdDate.textContent = item.created_at ? new Date(item.created_at).toLocaleString("pt-BR") : "—";

        const tdAct = document.createElement("td");
        if (st === "pending") {
          const actions = document.createElement("div");
          actions.className = "actions";
          const rejectBtn = document.createElement("button");
          rejectBtn.type = "button";
          rejectBtn.className = "btn btn-sm btn-reject";
          rejectBtn.textContent = "Rejeitar";

          const approveBtn = document.createElement("button");
          approveBtn.type = "button";
          approveBtn.className = "btn btn-sm btn-approve";
          approveBtn.textContent = "Aprovar";

          const armConfirm = (btn, idleLabel, confirmLabel, action) => {
            let armed = false;
            let timer = null;
            btn.addEventListener("click", () => {
              if (!armed) {
                armed = true;
                btn.textContent = confirmLabel;
                timer = setTimeout(() => {
                  armed = false;
                  btn.textContent = idleLabel;
                }, 4000);
                return;
              }
              clearTimeout(timer);
              armed = false;
              btn.textContent = idleLabel;
              process(action);
            });
          };

          const process = async (action) => {
            rejectBtn.disabled = true;
            approveBtn.disabled = true;
            const { data: out, error: err } = await supabase.functions.invoke("admin-signup-requests", {
              body: { action, requestId: item.id },
            });
            if (err) {
              setNotice("notice", "Falha ao atualizar solicitação: " + err.message, "error");
              rejectBtn.disabled = false;
              approveBtn.disabled = false;
              return;
            }
            setNotice("notice", out?.message || "Solicitação atualizada.", "success");
            await loadRequests();
          };

          armConfirm(rejectBtn, "Rejeitar", "Confirmar rejeição?", "reject");
          armConfirm(approveBtn, "Aprovar", "Confirmar aprovação?", "approve");
          actions.append(rejectBtn, approveBtn);
          tdAct.append(actions);
        } else {
          const done = document.createElement("span");
          done.className = "status-text muted";
          done.textContent = "Concluída";
          tdAct.append(done);
        }

        tr.append(tdInfo, tdStatus, tdDate, tdAct);
        tbody.append(tr);
      }

      table.append(tbody);
      root.append(table);
    }

    async function loadRequests() {
      setNotice("notice", "Carregando solicitações…");
      const { data: result, error: invokeError } = await supabase.functions.invoke("admin-signup-requests", {
        body: { action: "list" },
      });
      if (invokeError) {
        setNotice("notice", "Não foi possível carregar as solicitações: " + invokeError.message, "error");
        state.requests = [];
        renderTable();
        return;
      }
      state.requests = result?.requests || [];
      setNotice("notice", `${state.requests.length} solicitação(ões) carregada(s).`, "success");
      renderTable();
    }

    async function checkSession() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase.auth.getUser();
        const user = !error && data?.user ? data.user : null;
        if (!user) {
          $("login-section").classList.remove("hidden");
          $("admin-section").classList.add("hidden");
          $("logout-btn").classList.add("hidden");
          $("admin-email").textContent = "";
          return;
        }

        $("login-section").classList.add("hidden");
        $("admin-section").classList.remove("hidden");
        $("logout-btn").classList.remove("hidden");
        $("admin-email").textContent = user.email || "";

        const { data: admin, error: adminError } = await supabase
          .from("admin_users")
          .select("user_id")
          .eq("user_id", user.id)
          .maybeSingle();

        if (adminError || !admin) {
          state.isAdmin = false;
          setNotice("notice", "Sua conta não tem permissão para acessar esta página.", "error");
          renderTable();
          return;
        }
        state.isAdmin = true;
        await loadRequests();
      } catch (err) {
        $("login-section").classList.remove("hidden");
        $("admin-section").classList.add("hidden");
        setNotice("login-notice", "Erro ao verificar sessão: " + (err?.message || String(err)), "error");
      }
    }

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!supabase) {
        setNotice("login-notice", "Cliente de autenticação ainda não inicializado. Recarregue a página.", "error");
        return;
      }
      const btn = $("login-btn");
      btn.disabled = true;
      btn.textContent = "Validando…";
      setNotice("login-notice", "Verificando credenciais…");
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: $("email").value.trim(),
          password: $("password").value,
        });
        if (error) {
          setNotice("login-notice", "Falha no login: " + error.message, "error");
          return;
        }
        await checkSession();
      } catch (err) {
        setNotice("login-notice", "Erro de conexão ao autenticar: " + (err?.message || String(err)), "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });

    $("logout-btn").addEventListener("click", async () => {
      if (supabase) await supabase.auth.signOut();
      await checkSession();
    });

    $("reload-btn").addEventListener("click", loadRequests);

    $("search-input").addEventListener("input", (e) => {
      state.search = e.target.value.trim();
      renderTable();
    });

    for (const btn of document.querySelectorAll("[data-filter]")) {
      btn.addEventListener("click", () => {
        state.filter = btn.dataset.filter;
        for (const b of document.querySelectorAll("[data-filter]")) b.classList.toggle("active", b === btn);
        renderTable();
      });
    }

    async function init() {
      try {
        const createClient = await loadSupabaseClient();
        supabase = createClient(config.url, config.publishableKey, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: createSafeStorage(),
          },
        });
        await checkSession();
      } catch (err) {
        $("login-section").classList.remove("hidden");
        setNotice("login-notice", "Erro ao inicializar biblioteca de autenticação: " + (err?.message || String(err)), "error");
      }
    }

    init();
  </script>
</body>
</html>
