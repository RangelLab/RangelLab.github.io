<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10131c"><title>Admin — RangelLab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#10131c;--panel:#171b27;--line:rgba(255,255,255,.1);--muted:#a3abc0;--text:#f5f7ff;--violet:#00B4E6;--mint:#00D1A7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#7c5ce62b,transparent 34rem),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;padding:24px}a{color:#c9baff}.wrap{width:min(100%,760px);margin:24px auto}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1.25rem "Space Grotesk",sans-serif;margin-bottom:22px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#00B4E6,#0877ed);color:#141321}.panel,.request{border:1px solid var(--line);border-radius:20px;padding:20px;background:#171b27ef}h1{font:600 1.55rem "Space Grotesk",sans-serif;margin:0}p{color:var(--muted);font-size:.9rem;line-height:1.6}.requests{display:grid;gap:12px;margin-top:20px}.request-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.request-name{font-weight:700}.muted{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere;margin-top:5px}.status{border-radius:999px;background:#00B4E61c;color:#c9baff;padding:5px 9px;font-size:.7rem;font-weight:700;text-transform:uppercase}.actions{display:flex;gap:9px;margin-top:15px}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:var(--text);font:600 .82rem "DM Sans",sans-serif;cursor:pointer}.approve{background:#00D1A71a;color:var(--mint);border-color:#00D1A733}.reject{color:#fca5a5}.btn:disabled{opacity:.5}.notice{padding:12px;border-radius:12px;margin-top:15px;font-size:.85rem;line-height:1.5;background:#ffffff08;color:var(--muted)}.notice.error{color:#fca5a5;background:#f871711a}.notice.success{color:var(--mint);background:#00D1A71a}
</style></head><body><main class="wrap"><a class="brand" href="./"><span class="mark">RL</span><span>RangelLab</span></a><section class="panel"><h1>Administração</h1><p>Painel administrativo da organização RangelLab. Acesso restrito a administradores autorizados.</p><div id="notice" class="notice">Verificando permissões...</div><div id="requests" class="requests"></div><p><a href="./">Voltar à página principal</a></p></section></main>
<script src="./auth-config.js"></script><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.117.3";
const config=window.JSLYNK_AUTH_CONFIG||{},notice=document.querySelector("#notice"),container=document.querySelector("#requests");
const valid=/^https:\/\//.test(config.url||"")&&/^(sb_publishable_[A-Za-z0-9_\-]+|eyJ[A-Za-z0-9_\-\.]+)$/.test(config.publishableKey||"");
function setNotice(text,type=""){notice.textContent=text;notice.className="notice "+type}
function button(label,cls,fn){const b=document.createElement("button");b.className="btn "+cls;b.textContent=label;b.addEventListener("click",fn);return b}
if(!valid)setNotice("A configuração de autenticação do RangelLab não foi encontrada.","error");
else{
 const supabase=createClient(config.url,config.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data,error}=await supabase.auth.getUser();
 if(error||!data.user){location.replace("./auth.html")}
 else{
  const {data:admin,error:adminError}=await supabase.from("admin_users").select("user_id").eq("user_id",data.user.id).maybeSingle();
  if(adminError||!admin){setNotice("Sua conta não tem permissão para acessar esta página.","error")}
  else{
   async function load(){
    setNotice("Carregando solicitações...");
    container.replaceChildren();
    const {data:result,error:invokeError}=await supabase.functions.invoke("admin-signup-requests",{body:{action:"list"}});
    if(invokeError){setNotice("Não foi possível carregar as solicitações: "+invokeError.message,"error");return}
    const requests=result?.requests||[];
    if(!requests.length){setNotice("Nenhuma solicitação pendente ou aguardando aprovação.","success");return}
    setNotice(requests.length+" solicitação(ões) encontrada(s).","success");
    for(const item of requests){
     const card=document.createElement("article");card.className="request";
     const head=document.createElement("div");head.className="request-head";
     const info=document.createElement("div"),name=document.createElement("div"),email=document.createElement("div"),date=document.createElement("div"),status=document.createElement("span");
     name.className="request-name";name.textContent=item.name||"Sem nome";email.className="muted";email.textContent=item.email||"";date.className="muted";date.textContent=item.created_at?new Date(item.created_at).toLocaleString("pt-BR"):"";status.className="status";status.textContent=item.status==="approved"?"Aprovado":item.status==="rejected"?"Rejeitado":"Pendente";
     info.append(name,email,date);head.append(info,status);card.append(head);
     if(item.status==="pending"){
      const actions=document.createElement("div");actions.className="actions";
      const process=async action=>{for(const b of actions.querySelectorAll("button"))b.disabled=true;const {data:out,error:err}=await supabase.functions.invoke("admin-signup-requests",{body:{action,requestId:item.id}});if(err){setNotice("Falha ao atualizar solicitação: "+err.message,"error");for(const b of actions.querySelectorAll("button"))b.disabled=false}else{setNotice(out?.message||"Solicitação atualizada.","success");await load()}};
      actions.append(button("Rejeitar","reject",()=>process("reject")),button("Aprovar e liberar acesso","approve",()=>process("approve")));card.append(actions);
     }
     container.append(card);
    }
   }
   await load();
  }
 }
}
</script></body></html>
