<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10131c"><title>Versão — RangelLab</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#10131c;--line:rgba(255,255,255,.1);--muted:#a3abc0;--text:#f5f7ff;--mint:#00D1A7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#7c5ce62b,transparent 34rem),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;padding:24px}a{color:#c9baff}.wrap{width:min(100%,700px);margin:24px auto}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font:700 1.25rem "Space Grotesk",sans-serif;margin-bottom:22px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#00B4E6,#0877ed);color:#141321}.panel{border:1px solid var(--line);border-radius:24px;padding:clamp(20px,5vw,30px);background:#171b27ef}h1{font:600 1.65rem "Space Grotesk",sans-serif;margin:0}p{color:var(--muted);font-size:.92rem;line-height:1.6}.current{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:22px 0;padding:20px;border:1px solid #00B4E644;border-radius:18px;background:linear-gradient(135deg,#00B4E616,#00D1A708)}.version{font:700 clamp(1.45rem,5vw,2rem) "Space Grotesk",sans-serif}.pill{font-size:.75rem;color:#c9baff;border:1px solid #00B4E644;border-radius:999px;padding:7px 10px;white-space:nowrap}.section-title{font:600 1.1rem "Space Grotesk",sans-serif;margin:28px 0 8px}.entry{padding:17px 0;border-top:1px solid var(--line)}.entry-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}.entry-head strong{font-size:.94rem}.date{color:var(--muted);font-size:.78rem}.entry ul{margin:10px 0 0;padding-left:20px;color:#d3d8e7;font-size:.88rem;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:var(--text);font:600 .88rem "DM Sans",sans-serif;text-decoration:none;cursor:pointer}.status{color:var(--muted);font-size:.82rem;margin-top:12px}
</style></head><body><main class="wrap"><a class="brand" href="./"><span class="mark">RH</span><span>RangelLab</span></a><section class="panel"><h1>Versão do RangelLab</h1><p>Confira a versão atual do portal e o histórico de alterações.</p><div class="current"><div><div id="current-version" class="version">Carregando…</div></div><span class="pill">Portal RangelLab</span></div><h2 class="section-title">Histórico de versões</h2><div id="history"><p>Carregando histórico…</p></div><div class="actions"><button class="btn" id="refresh" type="button">Verificar atualização</button><a class="btn" href="./settings.html">Voltar às configurações</a></div><div class="status" id="status" role="status" aria-live="polite"></div></section></main>
<script type="module">
const currentVersion=document.querySelector("#current-version"),historyEl=document.querySelector("#history"),statusEl=document.querySelector("#status");
async function loadVersion(){statusEl.textContent="Verificando versão publicada…";try{const stamp=Date.now();const [pr,hr]=await Promise.all([fetch("./package.json?ts="+stamp,{cache:"no-store"}),fetch("./version-history.json?ts="+stamp,{cache:"no-store"})]);if(!pr.ok||!hr.ok)throw new Error("Não foi possível carregar os arquivos de versão.");const pkg=await pr.json(),history=await hr.json();currentVersion.textContent="v"+pkg.version;historyEl.replaceChildren();for(const item of history){const article=document.createElement("article");article.className="entry";const head=document.createElement("div");head.className="entry-head";const title=document.createElement("strong");title.textContent="v"+item.version;const date=document.createElement("span");date.className="date";date.textContent=item.date||"";head.append(title,date);article.append(head);const description=document.createElement("p");description.textContent=item.title||"Atualização do RangelLab";article.append(description);const list=document.createElement("ul");for(const change of(item.changes||[])){const li=document.createElement("li");li.textContent=change;list.append(li)}article.append(list);historyEl.append(article)}statusEl.textContent="Versão e histórico carregados."}catch(error){statusEl.textContent=error instanceof Error?error.message:"Erro ao carregar a versão.";currentVersion.textContent="Indisponível";}}
document.querySelector("#refresh").addEventListener("click",loadVersion);loadVersion();
</script></body></html>
